[project]
name = "shmitty-system-embedded-python"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["PyYAML==6.0.3"]

[tool.pytest.ini_options]
pythonpath = ["bin"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "space"
