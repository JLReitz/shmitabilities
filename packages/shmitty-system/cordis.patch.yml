- insert:
    - id: shmitty-system-path
      name: '@jlreitz/shmitty-system'
    - id: shmitty-system-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: shmitty-system
        includeDefaultRoots: false
        customSkillDirs:
          - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@jlreitz/shmitty-system/package.json')), 'skills')
