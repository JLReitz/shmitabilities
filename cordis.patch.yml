- insert:
    - id: shmitabilities-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: shmitabilities
        includeDefaultRoots: false
        customSkillDirs:
          - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@jlreitz/shmitabilities/package.json')), 'skills')
